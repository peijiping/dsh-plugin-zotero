<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Zotero Library for DSH">
  <defs>
    <linearGradient id="zp-bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b93ef"/>
      <stop offset="1" stop-color="#3568c4"/>
    </linearGradient>
    <linearGradient id="zp-paper" x1="18" y1="14" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf1fb"/>
    </linearGradient>
  </defs>

  <!-- Self-contained badge: readable on both light and dark host themes. -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#zp-bg)"/>

  <!-- A second sheet behind the front page: a library, not one document. -->
  <path d="M25 16h17a3 3 0 0 1 3 3v26" fill="none" stroke="#ffffff" stroke-opacity=".42" stroke-width="3" stroke-linecap="round"/>

  <!-- Front page. -->
  <rect x="16" y="13" width="27" height="38" rx="3.5" fill="url(#zp-paper)"/>
  <rect x="20" y="18.5" width="14" height="2.8" rx="1.4" fill="#4a86e8"/>
  <g fill="#9db2ce">
    <rect x="20" y="25.5" width="19" height="2" rx="1"/>
    <rect x="20" y="30.5" width="19" height="2" rx="1"/>
    <rect x="20" y="35.5" width="19" height="2" rx="1"/>
    <rect x="20" y="40.5" width="12" height="2" rx="1"/>
  </g>
  <!-- Highlighted line: annotations are what this plugin is about. -->
  <rect x="20" y="30.5" width="12" height="2" rx="1" fill="#e8a33d"/>

  <!-- Bookmark tab. -->
  <path d="M35 13h5.5v11l-2.75-2.6L35 24z" fill="#e8734a"/>
</svg>
